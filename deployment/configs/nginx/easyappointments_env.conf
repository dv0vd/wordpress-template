server {
    listen 80;
    server_name $EA_URL.$BASE_URL;

    location ^~ /.well-known/acme-challenge/ {
        alias /app/letsencrypt/acme/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    location / {
        return 301 https://$EA_URL.$BASE_URL$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name $EA_URL.$BASE_URL;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    ssl_certificate     /app/letsencrypt/certificates/live/$EA_URL.$BASE_URL/fullchain.pem;
    ssl_certificate_key /app/letsencrypt/certificates/live/$EA_URL.$BASE_URL/privkey.pem;

    client_max_body_size 64M;

    location / {
        proxy_pass http://easyappointments:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
