server {
    listen 80;
    server_name $EA_URL.$BASE_URL;

    location ^~ /.well-known/acme-challenge/ {
        alias /app/letsencrypt/acme/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    location / {
        return 301 https://$EA_URL.$BASE_URL$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name $EA_URL.$BASE_URL;

    ssl_certificate     /app/letsencrypt/certificates/live/$EA_URL.$BASE_URL/fullchain.pem;
    ssl_certificate_key /app/letsencrypt/certificates/live/$EA_URL.$BASE_URL/privkey.pem;

    client_max_body_size 64M;

    # Разрешаем встраивание в iframe только на основном домене WordPress
    add_header Content-Security-Policy "frame-ancestors 'self' https://$BASE_URL https://www.$BASE_URL;" always;
    add_header X-Frame-Options "ALLOW-FROM https://$BASE_URL" always;

    # 1. Публичная запись, статика и клиентский API (без Basic Auth)
    location / {
        proxy_pass http://easyappointments:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # 2. Админка, страница логина и бэкенд — закрыты Basic Auth.
    # Публичные контроллеры Easy!Appointments 1.6 (booking, booking_cancellation,
    # booking_confirmation, captcha, privacy, api/v1) обрабатываются выше в location /.
    location ~* ^/(index\.php/)?(about|account|admins|altcha_settings|api_settings|appointments|blocked_periods|booking_settings|business_settings|caldav|calendar|consents|console|customers|general_settings|google|google_analytics_settings|google_calendar_settings|installation|integrations|jitsi_settings|ldap_settings|legal_settings|localization|login|logout|matomo_analytics_settings|providers|recovery|secretaries|service_categories|services|test|unavailabilities|update|user|webhooks|working_plan_exceptions)(/|$) {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://easyappointments:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
