# Trust the podman reverse proxy so Easy!Appointments sees the real visitor IP.
# Without this, REMOTE_ADDR is the nginx container address, which alternates
# between its IPv4 and IPv6 addresses (dual-stack podman_network) and makes the
# session look invalid on every second request (login <-> calendar redirect loop).

LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so

RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1/8
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
RemoteIPInternalProxy fd00::/8
